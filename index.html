<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Lost and Found Board</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f766e">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
  <header class="top">
    <h1>Campus Lost and Found</h1>
    <p>Found something? Post it here. Lost something? Look for it below.</p>
  </header>

  <main class="layout">
    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">Post a found item</h2>
      <form id="item-form">
        <label>Item name
          <input type="text" id="name" required maxlength="60" placeholder="e.g. Blue water bottle">
        </label>
        <label>Category
          <select id="category" required>
            <option>Personal items</option>
            <option>School supplies</option>
            <option>IDs and cards</option>
            <option>Gadgets</option>
            <option>Clothing</option>
            <option>Other</option>
          </select>
        </label>
        <label>Description
          <textarea id="description" required rows="3" maxlength="200" placeholder="Color, brand, marks, condition"></textarea>
        </label>
        <label>Where was it found?
          <input type="text" id="location" required placeholder="e.g. Library, 1st floor">
        </label>
        <label>Date found
          <input type="date" id="date" required>
        </label>
        <label>Your name
          <input type="text" id="finder" required>
        </label>
        <label>How can the owner reach you?
          <input type="text" id="contact" required placeholder="Phone, email, or office">
        </label>
        <label>Photo of the item (optional)
          <input type="file" id="photo" accept="image/*">
        </label>
        <img id="preview" class="preview" alt="Photo preview" hidden>
        <button type="submit" class="primary">Post item</button>
      </form>
    </section>

    <section class="board" aria-labelledby="board-title">
      <h2 id="board-title">Found items <span id="count"></span></h2>
      <div class="tools">
        <input type="search" id="search" placeholder="Search by name, description, or place" aria-label="Search items">
        <select id="filter" aria-label="Filter by category">
          <option value="All">All categories</option>
          <option>Personal items</option>
          <option>School supplies</option>
          <option>IDs and cards</option>
          <option>Gadgets</option>
          <option>Clothing</option>
          <option>Other</option>
        </select>
        <label class="check"><input type="checkbox" id="hide-claimed" checked> Hide claimed</label>
      </div>
      <div id="list" class="list"></div>
      <p id="message" class="message" role="status"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
